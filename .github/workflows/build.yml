# 三平台构建。Windows 只能在 Windows 上编译 —— aws-lc-sys / ring 是 C 依赖,
# 从 macOS 跨编译会因为找不到 windows.h 而失败,所以这里靠各自的原生 runner。
#
# 产物是**精简版**:本地 AI(llama.cpp)和 Python 工作台的运行时体积大、不进
# 仓库,CI 不打包它们。应用会正常启动,那两个功能提示缺运行时,其余都能用。
# 要带运行时的包,见 README 的「可选的内置运行时」。
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 同一分支的新推送自动取消还在排队/运行的旧构建。三平台每个都要编 661 个
# crate,连推几次就能把自己的 runner 配额堵死 —— 踩过:7 轮同时排队,
# 最新那轮反而一直上不去。tag 不参与取消,发布不能被后来的推送打断。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
          # 不用 macos-13:GitHub 的 Intel runner 正在淘汰,极度稀缺 ——
          # 实测排队 30 分钟都分不到机器。改成在 arm64 runner 上交叉编译到
          # x86_64,苹果自家的交叉编译一向可靠(本机验证过,产出的是真正的
          # Mach-O x86_64)。
          - label: macOS (Intel)
            os: macos-14
            target: x86_64-apple-darwin
          - label: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # 守卫跑一次就够(和平台无关),放在 Apple Silicon 那条上。
      # 其余平台用 --no-check 跳过,避免三倍时间。
      - name: 守卫与类型检查
        if: matrix.target == 'aarch64-apple-darwin'
        run: npm run check

      - name: 前端构建
        run: npx vite build

      # beforeBuildCommand 默认是 `npm run build`,会把 50 套守卫再跑一遍。
      # 前端上一步已经构建过,所以用 tauri.ci.conf.json 把它置空。
      # 写成文件而不是 --config '{...}':内联 JSON 在 Windows 的 PowerShell
      # 里引号规则不同,会被拆坏。
      - name: 应用构建
        run: npx tauri build --target ${{ matrix.target }} --config src-tauri/tauri.ci.conf.json

      # 0.51.24 及以前只有可执行文件带了链接器签名,整个 .app 没签 —— 别的 Mac
      # 下载后直接「无法打开」,连「仍要打开」都不给。这里验 dmg 里那份 .app,
      # 签名不完整就不让发布。
      - name: 校验 macOS 签名
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)
          mnt=$(mktemp -d)
          yes | hdiutil attach -nobrowse -noverify -noautoopen -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          app="$mnt/DB Sonde.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Sealed Resources version=2'
          hdiutil detach "$mnt" >/dev/null

      # runner 的架构就是目标架构,不用 --target:带上它 cargo 会进"交叉编译"模式,
      # 构建脚本和 proc-macro 产出的 DLL 落在 host 的 target/debug,测试 exe 却在
      # target/<triple>/debug,Windows 上加载期就炸(0xc0000139)。
      - name: Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # 上一步在 Windows 上挂过 STATUS_ENTRYPOINT_NOT_FOUND —— 那是 DLL 找到了
      # 但缺导出符号。失败时把测试 exe 的依赖打出来,否则只能靠猜。
      - name: Windows 失败时导出 DLL 依赖
        if: failure() && matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter 'sonde_lib-*.exe' src-tauri/target |
                 Where-Object { $_.FullName -like '*deps*' } | Select-Object -First 1
          if (-not $exe) { Write-Output 'no test exe found'; exit 0 }
          Write-Output ("test exe: " + $exe.FullName)
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem -Recurse -Filter dumpbin.exe (Join-Path $vs 'VC\Tools\MSVC') |
                     Select-Object -First 1
          if ($dumpbin) { & $dumpbin.FullName /dependents $exe.FullName }
          else { Write-Output 'dumpbin not found' }

      # 即使单元测试挂了也要传产物 —— Windows 上应用构建是成功的,
      # 挂的是测试 exe 的加载(0xc0000139)。不传的话就没法下载来实际试。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-sonde-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: error

  # 打 tag 时把三个平台的包发成 Release。单独一个 job,不放进矩阵 ——
  # 三个并行 job 各自去建同一个 Release 会打架。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 按平台整理并改名
        run: |
          set -euo pipefail
          mkdir -p out
          ver="${GITHUB_REF_NAME#v}"
          while IFS= read -r -d '' f; do
            case "$f" in
              *aarch64-apple-darwin*)   plat=macOS_arm64 ;;
              *x86_64-apple-darwin*)    plat=macOS_x64 ;;
              *x86_64-pc-windows-msvc*) plat=Windows_x64 ;;
              *)                        plat=unknown ;;
            esac
            ext="${f##*.}"
            cp "$f" "out/DB-Sonde_${ver}_${plat}.${ext}"
          done < <(find artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -print0)
          ls -la out
          ( cd out && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt )

      # 不标 prerelease、并显式 --latest:仓库的「Latest」和 /releases/latest 只认
      # 非预发布版本。以前 app 全标成预发布,唯一的正式版是 Python 运行时,于是
      # 「最新版本」指向了三个 150MB 的运行时压缩包。Beta 写在标题和 README 里。
      - name: 建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "DB Sonde ${GITHUB_REF_NAME#v} Beta" \
            --latest \
            --notes "三平台构建产物,均由 CI 在各自的原生 runner 上构建。校验和见 SHA256SUMS.txt。

            **未签名**:macOS 首次打开走 系统设置 → 隐私与安全性 → 仍要打开;Windows 会弹 SmartScreen,点 更多信息 → 仍要运行。

            本地 AI 与 Python 运行时不含在安装包内,见 README 的「可选运行时」。"
