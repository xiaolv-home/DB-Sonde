# 为三个平台构建 Python 工作台的运行时，发成一个独立的 Release。
#
# 为什么单独一个 workflow、单独一个 tag：
#   · 运行时很少变（只有 Python 版本或包清单动了才重建），不该跟应用版本绑；
#   · 应用里把每个平台的 SHA256 **写死在 python.rs**，所以顺序必须是
#     「先建运行时 → 拿到哈希 → 填进源码 → 再发应用」。混在一个流水线里做
#     不到这一点。
#
# 跑法：Actions 页面手动触发，填 runtime_version（要和 python.rs 里的
# RUNTIME_VERSION、bundle-python.sh 里的一致）。跑完在 Release 页面拿哈希。
#
# pip 装的是**原生 wheel**（numpy / pandas / pyarrow / psycopg2 都是），
# 所以每个平台必须在自己的 runner 上构建，不能交叉编译。
name: python-runtime

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: "运行时版本号，如 py3.12.14-pkgs3（须与 python.rs 一致）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # 不用 macos-13:那类 Intel runner 正在淘汰,实测排队 30 分钟分不到
          # 机器。在 arm64 上构建,靠 pip --platform 取 x86_64 的 wheel。
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      # runner 在境外，直连 PyPI 比清华镜像快，也避免镜像同步滞后。
      - name: 构建运行时
        shell: bash
        env:
          PIP_INDEX: https://pypi.org/simple
        run: bash scripts/bundle-python.sh "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: src-tauri/binaries/python-runtime-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rt

      - name: 收齐并算校验和
        run: |
          set -euo pipefail
          mkdir -p out
          find rt -name 'python-runtime-*.tar.gz' -exec cp {} out/ \;
          ls -la out
          ( cd out && sha256sum ./*.tar.gz | tee SHA256SUMS.txt )

      # 标成预发布:它只给 app 后台下载用,不能占仓库的「Latest」——
      # 否则用户点「最新版本」看到的是运行时压缩包,不是安装包。
      # 下载地址 releases/download/<tag>/<文件> 不受预发布影响。
      - name: 发 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="runtime-${{ inputs.runtime_version }}"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Python 运行时 ${{ inputs.runtime_version }}" \
            --prerelease \
            --notes "$(printf '%s\n\n%s\n\n```\n%s\n```\n' \
              'DB Sonde 的 Python 工作台运行时（CPython + pandas/numpy/polars/pyarrow/matplotlib 等）。应用在用户点「一键安装」时按平台下载。' \
              '每个包的 SHA256 由应用**写死在源码里**校验，所以换运行时必须同步更新 src-tauri/src/python.rs 的 runtime_asset()。' \
              "$(cat out/SHA256SUMS.txt)")"
