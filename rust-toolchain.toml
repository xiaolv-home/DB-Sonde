# 放在仓库根目录,而不是 src-tauri。rustup 从进程当前目录往上找
# rust-toolchain.toml,不会往清单目录下面找。CI 的构建 job 在仓库根跑
# `cargo test --manifest-path src-tauri/Cargo.toml` 和 `npx tauri build`;
# clippy job 的工作目录是 src-tauri,会向上找到这一份。两边都生效。
#
# 1.90.0 是升级后依赖树里 cargo metadata 报出的最高 rust-version
# (tauri 2.12.4 及其插件、tauri-utils、tray-icon 都是 1.90),也高于要求的 1.85。
[toolchain]
channel = "1.90.0"
components = ["clippy", "rustfmt"]
